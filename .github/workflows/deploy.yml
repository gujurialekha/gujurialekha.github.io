name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so the blog cards baked into the HTML stay current for crawlers
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npx next build  # user site (gujurialekha.github.io): served from the root, no base path

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: tells Bing, Yandex, Naver, Seznam and Yep about every URL. Skipped on the daily
      # rebuild (nothing changed; re-pinging unchanged URLs gets throttled). Key file: public/<key>.txt
      - name: Checkout (for the IndexNow script)
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4

      - name: Notify IndexNow
        if: github.event_name != 'schedule'
        continue-on-error: true # a ping failure must never mark the deploy failed
        run: |
          urls=$(curl -s https://gujurialekha.github.io/sitemap.xml https://gujurialekha.github.io/blog/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//')
          python3 scripts/indexing_notify.py gujurialekha.github.io 08dd257431d96c25b69b2d369b1b41b9 $urls
